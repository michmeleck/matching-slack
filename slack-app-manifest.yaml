display_information:
  name: Matching Request Bot
  description: Validates uploaded creator-email CSVs and files a Linear "Matching request" ticket
  background_color: "#1c1c1c"
oauth_config:
  scopes:
    bot:
      - files:read
      - chat:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - file_shared
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
